# Selenized Dark: https://github.com/jan-warchol/selenized

[colors.bright]
black = "#72898f"
blue = "#58a3ff"
cyan = "#53d6c7"
green = "#84c747"
magenta = "#ff84cd"
red = "#ff665c"
white = "#cad8d9"
yellow = "#ebc13d"

[colors.cursor]
cursor = "#adbcbc"
text = "#082b34"

[colors.normal]
black = "#184956"
blue = "#4695f7"
cyan = "#41c7b9"
green = "#75b938"
magenta = "#f275be"
red = "#fa5750"
white = "#adbcbc"
yellow = "#dbb32d"

[colors.primary]
background = "#082b34"
foreground = "#adbcbc"

[colors.selection]
background = "#0d303a"
text = "#53d6c7"

[env]
TERM = "xterm-256color"

[font]
normal = { family = "iA Writer Mono S" }
bold = { family = "iA Writer Mono S" }
italic = { family = "iA Writer Mono S" }
size = 12

[window]
opacity = 1

[window.padding]
x = 4
y = 4

[keyboard]
bindings = [{ key = "F11", action = "ToggleFullscreen" }]
