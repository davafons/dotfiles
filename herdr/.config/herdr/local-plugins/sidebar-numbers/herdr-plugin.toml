id = "sidebar-numbers"
name = "Sidebar Numbers"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Show shortcut positions in the sidebar and agent numbers in tab labels."
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "sync.py"]

[[actions]]
id = "sync"
title = "Refresh sidebar numbers"
contexts = ["global"]
command = ["python3", "sync.py"]

[[actions]]
id = "agent-10"
title = "Jump to agent 10"
contexts = ["global"]
command = ["python3", "focus.py", "agent", "10"]

[[actions]]
id = "agent-11"
title = "Jump to agent 11"
contexts = ["global"]
