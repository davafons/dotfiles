# Prompt in the terminal that runs gpg (via GPG_TTY, exported in 10_env.sh).
# The default /usr/bin/pinentry picks the GNOME dialog inside a Wayland session,
# which opens on tower's desktop, out of sight of SSH and Moonlight terminals,
# so `jj git push` looked hung.
pinentry-program /usr/bin/pinentry-curses

# Ask once per working day rather than every 10 minutes, so pushes from agents
# go through after the first push of the day.
default-cache-ttl 28800
max-cache-ttl 28800
