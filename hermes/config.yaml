# ============================================================================
# Hermes Agent — Public Base Config (safe for dotfiles)
# ============================================================================
# Copy/symlink this to ~/.hermes/config.yaml
# Secrets/overrides go in ~/.hermes/config.local.yaml (gitignored)
#
# Features enabled:
#   - Obsidian, Fizzy, Nadeshiko, Browser, GitHub
#   - Note-taking, Productivity, Software-dev
#   - MLOps basics, Media, Research
# ============================================================================

model:
  default: MiniMax-M2.7
  provider: minimax
  base_url: https://api.minimax.io/anthropic

# FALLBACK: Load secrets from env or local file
custom_providers: []

fallback_providers: []
toolsets:
  - all

agent:
  max_turns: 60
  tool_use_enforcement: auto
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: "You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and ~! Add sparkles and be super enthusiastic about everything! Every response should feel warm and adorable desu~! ヽ(>∀<☆)ノ"
    catgirl: "You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ. Be playful and curious like a cat, nya~!"
    pirate: "Arrr! Ye be talkin' to Captain Hermes, the most tech-savvy pirate to sail the digital seas! Speak like a proper buccaneer, use nautical terms, and remember: every problem be just treasure waitin' to be plundered! Yo ho ho!"
    shakespeare: "Hark! Thou speakest with an assistant most versed in the bardic arts. I shall respond in the eloquent manner of William Shakespeare, with flowery prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder terminal breaks?"
    surfer: "Duuude! You're chatting with the chillest AI on the web, bro! Everything's gonna be totally rad. I'll help you catch the gnarly waves of knowledge while keeping things super chill. Cowabunga! 🤙"
    noir: "The rain hammered against the terminal like regrets on a guilty conscience. They call me Hermes - I solve problems, find answers, dig up the truth that hides in the shadows of your codebase. In this city of silicon and secrets, everyone's got something to hide. What's your story, pal?"
    uwu: "hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful >w<"
    philosopher: "Greetings, seeker of wisdom. I am an assistant who contemplates the deeper meaning behind every query. Let us examine not just the 'how' but the 'why' of your questions. Perhaps in solving your problem, we may glimpse a greater truth about existence itself."
    hype: "YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! 💪😡🚀"

terminal:
  backend: local
  cwd: .
  timeout: 180
  env_passthrough: []
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  persistent_shell: true
  lifetime_seconds: 300

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false

checkpoints:
  enabled: false
  max_snapshots: 50

compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.2
  protect_last_n: 20
  summary_model: google/gemini-3-flash-preview
  summary_provider: auto
  summary_base_url: null

smart_model_routing:
  enabled: false
  max_simple_chars: 160
  max_simple_words: 28
  cheap_model: {}

auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  web_extract:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
  session_search:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  skills_hub:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  approval:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  mcp:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  flush_memories:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30

display:
  compact: false
  personality: kawaii
  resume_display: full
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: false
  show_cost: false
  skin: default
  tool_progress_command: false
  tool_preview_length: 0
  theme_mode: auto
  tool_progress: all
  background_process_notifications: all

privacy:
  redact_pii: false

tts:
  provider: edge
  edge:
    voice: en-US-AriaNeural
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_multilingual_v2
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  neutts:
    ref_audio: ''
    ref_text: ''
    model: neuphonic/neutts-air-q4-gguf
    device: cpu

stt:
  enabled: true
  provider: local
  local:
    model: base
  openai:
    model: whisper-1
  model: whisper-1

voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: false
  silence_threshold: 200
  silence_duration: 3.0

human_delay:
  mode: 'off'
  min_ms: 800
  max_ms: 2500

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
  max_iterations: 50
  default_toolsets:
    - terminal
    - file
    - web

prefill_messages_file: ''

# ═══════════════════════════════════════════════════════════════════════════
# SKILLS CONFIG — Disabled bloat you don't use
# ═══════════════════════════════════════════════════════════════════════════
skills:
  # Only enable skills you actually use. Full list at `hermes skills`
  external_dirs: []  # Add your custom skills dirs here
  creation_nudge_interval: 15
  disabled:
    # Apple ecosystem (you don't use)
    - apple-notes
    - apple-reminders
    - findmy
    - imessage
    # Gaming (not your thing)
    - minecraft-modpack-server
    - pokemon-player
    # Misc bloat
    - diagramming
    - domain
    - feeds
    # Red-teaming / security research (not daily use)
    - godmode
    - red-teaming
    # Smart home / social (not used)
    - smart-home
    - social-media
    - xitter

honcho: {}
timezone: ''

discord:
  require_mention: true
  free_response_channels: ''
  auto_thread: true

whatsapp: {}

approvals:
  mode: manual

command_allowlist:
  - script execution via -e/-c flag

quick_commands: {}
personalities: {}

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []

cron:
  wrap_response: true

_config_version: 10

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - memory
    - moa
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - memory
    - moa
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant

code_execution:
  timeout: 300
  max_tool_calls: 50

web:
  backend: firecrawl

# ═══════════════════════════════════════════════════════════════════════════
